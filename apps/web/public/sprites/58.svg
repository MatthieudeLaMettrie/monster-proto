      <stop offset="0%" stop-color="#F5B041" />
      <stop offset="60%" stop-color="#C0392B" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </radialGradient>
  </defs>
  <!-- Shadow Disc -->
  <ellipse cx="32" cy="58" rx="19" ry="4.5" fill="#000" opacity="0.25" />
  
  <!-- Motif background -->
  <rect x="20" y="44" width="24" height="6" rx="3" fill="#7F1D1D" stroke="#111" stroke-width="1" /><rect x="22" y="42" width="20" height="2" fill="#FFF" />
  <!-- Body shape -->
  
        <!-- Horns/Crest -->
        <polygon points="23,20 27,14 31,20" fill="#7F1D1D" stroke="#111" stroke-width="1.5" />
        <polygon points="33,20 37,14 41,20" fill="#7F1D1D" stroke="#111" stroke-width="1.5" />
        <!-- Body -->
        <rect x="18.4" y="21.6" width="27.2" height="28.8" rx="9.6" fill="url(#grad)" stroke="#111" stroke-width="2.5" />
        <ellipse cx="32" cy="40" rx="9.6" ry="7.2" fill="#F5B041" opacity="0.6" />
        <!-- Feet -->
        <ellipse cx="24.8" cy="54" rx="5" ry="3.5" fill="#F5B041" stroke="#111" stroke-width="2" />
        <ellipse cx="39.2" cy="54" rx="5" ry="3.5" fill="#F5B041" stroke="#111" stroke-width="2" />
      
  <!-- Expressive Face & Eyes -->
  
    <!-- Left Eye -->
    <ellipse cx="25.5" cy="34" rx="3.8" ry="4.18" fill="#FFFFFF" stroke="#111" stroke-width="1.4" />
    <circle cx="26.3" cy="34" r="1.9" fill="#111" />
    <circle cx="24.8" cy="32.8" r="1" fill="#FFF" />

    <!-- Right Eye -->
