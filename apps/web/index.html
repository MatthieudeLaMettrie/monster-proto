<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Proto</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #top-navbar {
        width: 100%;
        max-width: 480px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background: #1e293b;
        border-radius: 8px 8px 0 0;
        border-bottom: 2px solid #334155;
      }
      .nav-title {
        font-weight: 700;
        font-size: 14px;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .nav-actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        background: #3b82f6;
        color: #fff;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .btn:hover {
        background: #2563eb;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-save {
        background: #10b981;
      }
      .btn-save:hover {
        background: #059669;
      }
      .btn-heal {
        background: #0284c7;
      }
      .btn-heal:hover {
        background: #0369a1;
      }
      #game-container {
        width: 480px;
        height: 320px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        background: #000;
        border-radius: 0 0 8px 8px;
        overflow: hidden;
      }
      #save-toast {
        position: fixed;
        bottom: 20px;
        background: #10b981;
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- Top Persistent Control Bar -->
    <div id="top-navbar">
      <div class="nav-title">🐾 Monster Proto</div>
      <div class="nav-actions">
        <button id="btn-sound" class="btn" title="Toggle 8-bit Sound Effects" style="background: #475569;">🔊 Audio</button>
        <button id="btn-party" class="btn" title="View Party, Bag, and Pokedex">👥 Party / Bag</button>
        <button id="btn-heal" class="btn btn-heal" title="Revitalize all fainted/hurt monsters">💖 Revitalize</button>
        <button id="btn-save" class="btn btn-save" title="Save your game state">💾 Save Game</button>
      </div>
    </div>

    <!-- 2D Canvas -->
    <div id="game-container"></div>

    <!-- Audio & Chiptune BGM Popover Panel (Pillar 4) -->
    <div id="audio-panel" style="display: none; position: absolute; top: 52px; z-index: 10000; width: 280px; background: #0f172aEE; backdrop-filter: blur(8px); border: 2px solid #334155; border-radius: 10px; padding: 12px 14px; box-shadow: 0 16px 32px rgba(0,0,0,0.7); color: #f8fafc; font-size: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 6px;">
        <strong style="color: #38bdf8; display: flex; align-items: center; gap: 5px;">🎵 8-Bit Chiptune & Audio</strong>
        <button id="btn-close-audio" style="background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 15px; font-weight: bold; line-height: 1;">✕</button>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-weight: 500;">Master Mute</span>
        <button id="btn-master-mute" class="btn" style="padding: 3px 10px; font-size: 11px; background: #475569;">Mute</button>
      </div>

      <div style="margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>🎵 Chiptune BGM</span>
          <span id="bgm-vol-val" style="color: #38bdf8; font-weight: bold;">35%</span>
        </div>
        <input type="range" id="bgm-slider" min="0" max="100" value="35" style="width: 100%; accent-color: #38bdf8; cursor: pointer;" />
      </div>

      <div style="margin-bottom: 12px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>🔊 Sound Effects (SFX)</span>
          <span id="sfx-vol-val" style="color: #10b981; font-weight: bold;">80%</span>
        </div>
        <input type="range" id="sfx-slider" min="0" max="100" value="80" style="width: 100%; accent-color: #10b981; cursor: pointer;" />
      </div>

      <div style="font-size: 11px; background: #1e293b; padding: 7px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
        <span>Track: <strong id="current-track-name" style="color: #fbbf24;">Pallet Plaza</strong></span>
        <button id="btn-test-sfx" style="background: #334155; color: #f8fafc; border: 1px solid #475569; border-radius: 4px; padding: 3px 8px; font-size: 10px; font-weight: bold; cursor: pointer;">▶ Test SFX</button>
      </div>
    </div>

    <div id="save-toast">Game Saved Successfully!</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
