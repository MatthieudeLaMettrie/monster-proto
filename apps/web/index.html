<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Proto</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #top-navbar {
        width: 100%;
        max-width: 480px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background: #1e293b;
        border-radius: 8px 8px 0 0;
        border-bottom: 2px solid #334155;
      }
      .nav-title {
        font-weight: 700;
        font-size: 14px;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .nav-actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        background: #3b82f6;
        color: #fff;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .btn:hover {
        background: #2563eb;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-save {
        background: #10b981;
      }
      .btn-save:hover {
        background: #059669;
      }
      .btn-heal {
        background: #0284c7;
      }
      .btn-heal:hover {
        background: #0369a1;
      }
      #game-container {
        width: 480px;
        height: 320px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        background: #000;
        border-radius: 0 0 8px 8px;
        overflow: hidden;
      }
      #save-toast {
        position: fixed;
        bottom: 20px;
        background: #10b981;
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- Top Persistent Control Bar -->
    <div id="top-navbar">
      <div class="nav-title">🐾 Monster Proto</div>
      <div class="nav-actions">
        <button id="btn-sound" class="btn" title="Toggle 8-bit Sound Effects" style="background: #475569;">🔊 Audio</button>
        <button id="btn-party" class="btn" title="View Party, Bag, and Pokedex">👥 Party / Bag</button>
        <button id="btn-heal" class="btn btn-heal" title="Revitalize all fainted/hurt monsters">💖 Revitalize</button>
        <button id="btn-save" class="btn btn-save" title="Save your game state">💾 Save Game</button>
      </div>
    </div>

    <!-- 2D Canvas -->
    <div id="game-container"></div>

    <div id="save-toast">Game Saved Successfully!</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
